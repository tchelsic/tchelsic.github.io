<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page Not Found</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(18, 26, 48, .78);
      --text: #f4f7ff;
      --muted: #a8b2ca;
      --accent: #8b7cff;
      --accent-2: #54d6ff;
      --border: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(84,214,255,.13), transparent 38%),
        radial-gradient(ellipse at 85% 80%, rgba(139,124,255,.16), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 58px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 90px rgba(0,0,0,.28);
      backdrop-filter: blur(14px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 12px var(--accent-2);
    }
    h1 {
      margin: 24px 0 8px;
      font-size: clamp(5rem, 19vw, 9rem);
      line-height: .95;
      letter-spacing: -.08em;
      font-weight: 850;
      background: linear-gradient(120deg, var(--accent-2), var(--accent) 65%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h2 {
      margin: 22px 0 12px;
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: -.035em;
    }
    p {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.75;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    a:hover { transform: translateY(-2px); border-color: rgba(139,124,255,.65); }
    a:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 4px; }
    .primary {
      color: #0b1020;
      border-color: transparent;
      background: linear-gradient(110deg, var(--accent-2), #b3a8ff);
    }
    .primary:hover { background: linear-gradient(110deg, #8ce7ff, #c7beff); }
    .footnote { margin-top: 28px; font-size: .85rem; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Error · 404</div>
    <h1 aria-label="404">404</h1>
    <h2>Oops! Page not found.</h2>
    <p>The page you’re looking for may have been moved, deleted, or never existed. Let’s get you back on track.</p>
    <nav class="actions" aria-label="Page navigation">
      <a class="primary" href="./">Go to homepage <span aria-hidden="true">&nbsp;→</span></a>
      <a href="#" id="back-link">Go back</a>
    </nav>
    <p class="footnote">If you typed the address, check it for mistakes and try again.</p>
  </main>
  <script>
    document.getElementById("back-link").addEventListener("click", function (event) {
      event.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "./";
      }
    });
  </script>
</body>
</html>
